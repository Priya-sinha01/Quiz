<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <style>
        :root {
            --bg: #f6f7f4;
            --panel: #ffffff;
            --panel-soft: #fafbf9;
            --line: #e3e7e1;
            --text: #202420;
            --muted: #626a62;
            --accent: #879684;
            --accent-deep: #687866;
            --success: #286343;
            --success-soft: #eff6f1;
            --danger: #913f3f;
            --danger-soft: #fbf1f0;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        body {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100svh;
            padding: 24px;
            background-color: #111722;
            background-image: url("assets/moon.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at center,
                rgba(10, 12, 16, 0) 0%,
                rgba(10, 12, 16, 0.02) 25%,
                rgba(10, 12, 16, 0.18) 38%,
                rgba(10, 12, 16, 0.45) 50%,
                rgba(10, 12, 16, 0.74) 62%,
                rgba(10, 12, 16, 0.88) 78%,
                rgba(10, 12, 16, 0.92) 100%);
            pointer-events: none;
        }

        .app-shell {
            position: relative;
            z-index: 1;
            width: 88%;
            max-width: 490px;
        }

        .quiz-card {
            background: rgba(250, 249, 246, 0.94);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 22px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .brand {
            font-size: 0.75rem;
            letter-spacing: 0;
            text-transform: uppercase;
            color: #3f443f;
            font-weight: 700;
        }

        .score-pill {
            border: 1px solid var(--line);
            background: var(--panel-soft);
            color: var(--text);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .progress-row {
            margin-bottom: 10px;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            color: #3f443f;
            font-size: 0.92rem;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            border-radius: 999px;
            background: #f0f2ee;
            overflow: hidden;
            border: 1px solid var(--line);
        }

        .progress-bar {
            display: block;
            width: 0%;
            height: 100%;
            background: var(--accent);
            border-radius: inherit;
            transition: width 0.28s ease;
        }

        .question-panel {
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
        }

        #question {
            margin: 0;
            font-size: 1.8rem;
            line-height: 1.35;
            font-weight: 600;
            color: var(--text);
        }

        #options {
            display: grid;
            gap: 8px;
            margin-bottom: 10px;
        }

        .option {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            background: #fff;
            text-align: left;
            color: #303030;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .option:not(:disabled):hover {
            border-color: var(--accent-deep);
            box-shadow: 0 3px 10px rgba(32, 36, 32, 0.045);
        }

        .option:disabled {
            cursor: default;
            opacity: 1;
        }

        .option.correct {
            background: var(--success-soft);
            border-color: rgba(40, 99, 67, 0.38);
            color: var(--success);
        }

        .option.wrong {
            background: var(--danger-soft);
            border-color: rgba(145, 63, 63, 0.38);
            color: var(--danger);
        }

        .feedback {
            min-height: 18px;
            font-weight: 600;
            font-size: 0.98rem;
            margin-bottom: 8px;
            color: var(--muted);
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        .feedback.correct {
            color: var(--success);
        }

        .feedback.wrong {
            color: var(--danger);
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .question-panel.wrong-shake {
            animation: wrongShake 0.45s ease-in-out;
            border-color: rgba(145, 63, 63, 0.35);
            box-shadow: 0 0 0 1px rgba(145, 63, 63, 0.1);
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            font: inherit;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, opacity 0.18s ease;
        }

        button:focus-visible {
            outline: 3px solid rgba(104, 120, 102, 0.45);
            outline-offset: 2px;
        }

        .primary-btn,
        .secondary-btn {
            min-width: 140px;
            padding: 10px 14px;
            font-weight: 600;
        }

        .primary-btn {
            background: var(--text);
            color: #fff;
            box-shadow: 0 3px 8px rgba(32, 36, 32, 0.1);
        }

        .primary-btn:hover:not(:disabled) {
            background: #343a34;
        }

        .secondary-btn {
            background: #fff;
            color: var(--text);
            border: 1px solid var(--line);
        }

        .secondary-btn:hover:not(:disabled) {
            background: var(--panel-soft);
            border-color: var(--accent-deep);
        }

        .result-box {
            text-align: center;
            padding: 8px 0 4px;
        }

        .result-score {
            font-size: 2.4rem;
            font-weight: 700;
            margin: 10px 0 6px;
        }

        .result-message {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
        }

        @media (max-width: 560px) {
            body {
                padding: 14px;
            }

            .quiz-card {
                padding: 22px 18px;
            }

            .app-shell {
                width: min(88vw, 100%);
                max-width: none;
            }

            #question {
                font-size: 1.5rem;
            }

            .topbar {
                align-items: center;
            }

            .actions {
                justify-content: flex-end;
            }

            .primary-btn,
            .secondary-btn {
                min-width: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <section class="quiz-card" aria-live="polite">
            <header class="topbar">
                <div class="brand">Quick Quiz</div>
                <div id="score" class="score-pill">Score: 0</div>
            </header>

            <div class="progress-row">
                <div class="progress-top">
                    <span id="progress-text">Question 1 of 10</span>
                    <span id="question-number-label">1 / 10</span>
                </div>
                <div class="progress-track" aria-hidden="true">
                    <span id="progress-bar" class="progress-bar"></span>
                </div>
            </div>

            <div class="question-panel">
                <p id="question">Test Your Knowledge!</p>
            </div>

            <div id="options" class="options-grid" role="list"></div>
            <div id="feedback" class="feedback" aria-live="polite"></div>

            <div class="actions">
                <button id="start-btn" class="primary-btn" type="button">Start Quiz</button>
                <button id="next-btn" class="primary-btn" type="button" hidden>Next Question</button>
                <button id="restart-btn" class="secondary-btn" type="button" hidden>Restart Quiz</button>
            </div>
        </section>
    </main>

    <audio id="wrongSound" preload="auto">
        <source src="assets/oh-no.mp3" type="audio/mpeg">
    </audio>

    <script src="Script.js"></script>
</body>
</html>
